<style id="poly-resource-search-style">
  #poly-resource-launcher {
    position: fixed; z-index: 2147483000; right: 16px; top: 16px;
    border: 1px solid rgba(255,255,255,.24); border-radius: 9px;
    background: rgba(20,25,34,.92); color: #fff; padding: 9px 13px;
    font: 600 13px/1.2 system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,.28); backdrop-filter: blur(8px);
  }
  #poly-resource-launcher:hover { background: #303b4d; }
  #poly-resource-search[hidden] { display:none !important; }
  #poly-resource-search {
    position: fixed; inset: 0; z-index: 2147483001; display:flex;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(4,8,14,.78); color:#edf2f8;
    font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
  }
  #poly-resource-search * { box-sizing:border-box; }
  #poly-resource-search .prs-panel {
    width:min(900px,100%); max-height:min(820px,92vh); display:flex;
    flex-direction:column; overflow:hidden; border:1px solid #394658;
    border-radius:15px; background:#111923; box-shadow:0 24px 80px #0009;
  }
  #poly-resource-search .prs-header {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:17px 19px; border-bottom:1px solid #2a3543;
  }
  #poly-resource-search .prs-title { font-size:17px; font-weight:750; letter-spacing:.1px; }
  #poly-resource-search .prs-subtitle { color:#9eacbd; font-size:12px; margin-top:2px; }
  #poly-resource-search .prs-close {
    border:0; border-radius:8px; background:#253142; color:#fff;
    width:34px; height:34px; font-size:21px; cursor:pointer;
  }
  #poly-resource-search .prs-controls { padding:15px 18px 10px; }
  #poly-resource-search .prs-input {
    display:block; width:100%; padding:13px 14px; border:1px solid #48586c;
    border-radius:9px; outline:none; background:#0b1119; color:#fff;
    font:15px system-ui,sans-serif;
  }
  #poly-resource-search .prs-input:focus { border-color:#70a8ff; box-shadow:0 0 0 3px #438cff2b; }
  #poly-resource-search .prs-filters { display:flex; gap:7px; flex-wrap:wrap; margin-top:11px; }
  #poly-resource-search .prs-filter {
    border:1px solid #344254; border-radius:20px; padding:6px 11px;
    color:#bdc9d8; background:#1a2532; cursor:pointer; font:600 12px system-ui,sans-serif;
  }
  #poly-resource-search .prs-filter[aria-pressed="true"] { color:#fff; background:#315b91; border-color:#5b91d0; }
  #poly-resource-search .prs-status { padding:2px 19px 10px; color:#9eacbd; font-size:12px; }
  #poly-resource-search .prs-results {
    overflow:auto; padding:0 18px 18px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(245px,100%),1fr)); gap:10px;
  }
  #poly-resource-search .prs-card {
    min-width:0; border:1px solid #2d3948; border-radius:10px;
    background:#18222e; overflow:hidden;
  }
  #poly-resource-search .prs-preview {
    height:115px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; background:#0c131c; color:#72849a;
  }
  #poly-resource-search .prs-preview img { width:100%; height:100%; object-fit:contain; }
  #poly-resource-search .prs-preview audio { width:90%; }
  #poly-resource-search .prs-body { padding:10px 11px 11px; }
  #poly-resource-search .prs-name { color:#f4f7fb; font-weight:650; overflow-wrap:anywhere; }
  #poly-resource-search .prs-path { color:#91a1b4; font-size:11px; margin-top:3px; overflow-wrap:anywhere; }
  #poly-resource-search .prs-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:9px; }
  #poly-resource-search .prs-tag { color:#a9c9ef; font-size:10px; text-transform:uppercase; letter-spacing:.6px; }
  #poly-resource-search .prs-open {
    display:inline-block; border-radius:6px; padding:5px 9px; background:#2b5f9b;
    color:white; text-decoration:none; font-size:11px; font-weight:650;
  }
  #poly-resource-search .prs-empty { grid-column:1/-1; padding:38px 12px; text-align:center; color:#9eacbd; }
  @media(max-width:560px) {
    #poly-resource-launcher { top:9px; right:9px; padding:8px 10px; }
    #poly-resource-search { padding:7px; }
    #poly-resource-search .prs-panel { max-height:96vh; }
    #poly-resource-search .prs-results { grid-template-columns:1fr; }
  }
</style>


<section id="poly-resource-search" hidden role="dialog" aria-modal="true" aria-label="Game resource search">
  <div class="prs-panel">
    <header class="prs-header">
      <div><div class="prs-title">Game Resource Search</div><div class="prs-subtitle">Browse the assets included with this game build</div></div>
      <button class="prs-close" type="button" aria-label="Close search">×</button>
    </header>
    <div class="prs-controls">
      <input class="prs-input" id="prs-query" type="search" placeholder="Search images, sounds, tracks, models…" autocomplete="off" spellcheck="false">
      <div class="prs-filters" aria-label="Resource type filters">
        <button class="prs-filter" data-kind="All" aria-pressed="true">All</button>
        <button class="prs-filter" data-kind="Images" aria-pressed="false">Images</button>
        <button class="prs-filter" data-kind="Audio" aria-pressed="false">Audio</button>
        <button class="prs-filter" data-kind="Tracks" aria-pressed="false">Tracks</button>
        <button class="prs-filter" data-kind="Models" aria-pressed="false">Models</button>
        <button class="prs-filter" data-kind="Fonts" aria-pressed="false">Fonts</button>
        <button class="prs-filter" data-kind="Configs" aria-pressed="false">Configs</button>
      </div>
    </div>
    <div class="prs-status" id="prs-status" aria-live="polite"></div>
    <div class="prs-results" id="prs-results"></div>
  </div>
</section>

<script id="poly-resource-search-script">
(() => {
  "use strict";
  const dataNode = document.getElementById("poly-resource-search-data");
  const resources = JSON.parse(dataNode.textContent);
  const overlay = document.getElementById("poly-resource-search");
  
  const input = document.getElementById("prs-query");
  const results = document.getElementById("prs-results");
  const status = document.getElementById("prs-status");
  const closeButton = overlay.querySelector(".prs-close");
  const filters = [...overlay.querySelectorAll(".prs-filter")];
  let activeKind = "All";
  let lastFocus = null;

  const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
  const urlFor = path => path.split("/").map(encodeURIComponent).join("/");
  const iconFor = kind => ({
    Images:"▧", Audio:"♫", Tracks:"⌁", Models:"◇", Fonts:"Aa", Configs:"⚙"
  }[kind] || "•");

  function render() {
    const query = input.value.trim().toLowerCase();
    const terms = query.split(/\s+/).filter(Boolean);
    const matches = resources.filter(item => {
      if (activeKind !== "All" && item.kind !== activeKind) return false;
      const haystack = (item.search + " " + item.name.toLowerCase() + " " + item.kind.toLowerCase()).toLowerCase();
      return terms.every(term => haystack.includes(term));
    });
    status.textContent = `${matches.length.toLocaleString()} resource${matches.length === 1 ? "" : "s"} found` +
      (matches.length > 100 ? " · showing first 100" : "");
    const shown = matches.slice(0, 100);
    if (!shown.length) {
      results.innerHTML = '<div class="prs-empty">No matching resources. Try another search or filter.</div>';
      return;
    }
    results.innerHTML = shown.map(item => {
      const path = urlFor(item.path);
      const ext = item.path.split(".").pop().toLowerCase();
      let preview = `<span>${iconFor(item.kind)}</span>`;
      if (item.kind === "Images") {
        preview = `<img loading="lazy" src="${escapeHTML(path)}" alt="${escapeHTML(item.name)}" onerror="this.parentNode.textContent='Preview unavailable'">`;
      } else if (item.kind === "Audio") {
        preview = `<audio controls preload="none" src="${escapeHTML(path)}"></audio>`;
      } else if (item.kind === "Tracks") {
        preview = `<span>TRACK FILE</span>`;
      } else if (item.kind === "Models") {
        preview = `<span>3D MODEL · ${escapeHTML(ext.toUpperCase())}</span>`;
      } else if (item.kind === "Fonts") {
        preview = `<span style="font-size:28px;font-weight:700">Aa</span>`;
      } else if (item.kind === "Configs") {
        preview = `<span>CONFIG FILE</span>`;
      }
      return `<article class="prs-card">
        <div class="prs-preview">${preview}</div>
        <div class="prs-body">
          <div class="prs-name">${escapeHTML(item.name)}</div>
          <div class="prs-path">${escapeHTML(item.path)}</div>
          <div class="prs-meta"><span class="prs-tag">${escapeHTML(item.kind)}</span>
            <a class="prs-open" href="${escapeHTML(path)}" target="_blank" rel="noopener">Open resource ↗</a>
          </div>
        </div>
      </article>`;
    }).join("");
  }

  function openSearch() {
    lastFocus = document.activeElement;
    overlay.hidden = false;
    input.focus();
    render();
  }
  function closeSearch() {
    overlay.hidden = true;
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }
  
  closeButton.addEventListener("click", closeSearch);
  overlay.addEventListener("click", event => { if (event.target === overlay) closeSearch(); });
  input.addEventListener("input", render);
  filters.forEach(button => button.addEventListener("click", () => {
    activeKind = button.dataset.kind;
    filters.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
    render();
  }));
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !overlay.hidden) {
        closeSearch();
    }
});
  // Allow direct links such as ?resourceSearch=1 to open the panel.
  if (new URLSearchParams(location.search).has("resourceSearch")) openSearch();
})();
</script>
